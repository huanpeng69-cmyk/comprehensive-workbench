# 综合管理工作台 · 生产入口 Nginx 配置
# 由 deploy/docker-compose.prod.yml 挂载到 /etc/nginx/conf.d/default.conf
#
# 职责：
#   1. 托管 Vue 构建产物（web/dist，只读挂载）
#   2. /api/** 反向代理到宿主机 Spring Boot(:8080)
#   3. 部门用户只需访问 80 端口，无需感知后端端口
#   4. 基础安全响应头 + 拒绝隐藏文件

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 拒绝隐藏文件（.env/.git 等，防御性规则）
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 后端健康检查（供运维探活）
    location = /actuator/health {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
    }

    # API 反向代理：浏览器同源调用 /api/**，无跨域问题
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 20m;
    }

    # 文本类静态文件不走 SPA 回退：缺失一律 404
    # （防止前端产物之外的路径被 index.html 兜底返回 200 造成误判/枚举）
    location ~* \.(txt|md|log|sql|yml|yaml|properties|env)$ {
        try_files $uri =404;
    }

    # 前端静态资源 + SPA 回退（hash 路由，回退兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
