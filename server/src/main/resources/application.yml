spring:
  application:
    name: workbench-server
  datasource:
    url: ${WORKBENCH_DB_URL:jdbc:postgresql://localhost:5432/workbench}
    username: ${WORKBENCH_DB_USER:workbench}
    password: ${WORKBENCH_DB_PASSWORD:workbench123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      password: ${WORKBENCH_REDIS_PASSWORD:}

server:
  port: 8080

workbench:
  jwt:
    # 生产环境必须覆盖：放在 server/config/application.yml（已 gitignore）或环境变量
    secret: ${WORKBENCH_JWT_SECRET:workbench-dev-secret-change-in-production-please-use-a-long-key}
    expiration-minutes: ${WORKBENCH_JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${WORKBENCH_CORS_ORIGINS:http://localhost:5173}
  regulations:
    # 制度正文目录（相对于后端工作目录 server/）
    dir: ${WORKBENCH_REGULATIONS_DIR:./regulations}
  login:
    max-failures: ${WORKBENCH_LOGIN_MAX_FAILURES:5}
    lock-minutes: ${WORKBENCH_LOGIN_LOCK_MINUTES:15}
  kb:
    # 企业知识库（.pi 项目）服务地址，工作台后端以只读服务令牌转发调用
    base-url: ${WORKBENCH_KB_BASE_URL:http://127.0.0.1:8765}
    # 令牌经环境变量 WORKBENCH_KB_SERVICE_TOKEN 注入（start-workbench.bat 从同目录
    # git-ignored 的 .kbtoken 文件读取）。默认留空：源码不含真实令牌；为空时知识库会拒绝桥接。
    service-token: ${WORKBENCH_KB_SERVICE_TOKEN:}
  ai:
    # AI 写作台：OpenAI 兼容 Chat Completions 服务根地址（例如以 /v1 结尾）
    base-url: ${WORKBENCH_AI_BASE_URL:}
    # 模型名，由后端写入请求体，不在前端配置
    model: ${WORKBENCH_AI_MODEL:}
    # 服务端密钥；本地自部署模型可为空。不要写入仓库或前端
    api-key: ${WORKBENCH_AI_API_KEY:}

logging:
  level:
    com.workbench: INFO
    org.hibernate.SQL: INFO
