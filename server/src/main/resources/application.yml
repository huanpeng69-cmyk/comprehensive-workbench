spring:
  application:
    name: workbench-server
  datasource:
    url: ${WORKBENCH_DB_URL:jdbc:postgresql://localhost:5432/workbench}
    username: ${WORKBENCH_DB_USER:workbench}
    password: ${WORKBENCH_DB_PASSWORD:workbench123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      password: ${WORKBENCH_REDIS_PASSWORD:}

server:
  port: 8080

workbench:
  jwt:
    # 生产环境必须覆盖：放在 server/config/application.yml（已 gitignore）或环境变量
    secret: ${WORKBENCH_JWT_SECRET:workbench-dev-secret-change-in-production-please-use-a-long-key}
    expiration-minutes: ${WORKBENCH_JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${WORKBENCH_CORS_ORIGINS:http://localhost:5173}
  regulations:
    # 制度正文目录（相对于后端工作目录 server/）
    dir: ${WORKBENCH_REGULATIONS_DIR:./regulations}
  login:
    max-failures: ${WORKBENCH_LOGIN_MAX_FAILURES:5}
    lock-minutes: ${WORKBENCH_LOGIN_LOCK_MINUTES:15}

logging:
  level:
    com.workbench: INFO
    org.hibernate.SQL: INFO
